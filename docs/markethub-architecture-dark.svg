<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 950" width="1000" height="950" role="img" aria-label="MarketHub architecture: a browser used by Admin, Seller and Buyer sends web requests into one Spring Boot application, through the Spring Security filter chain (form login, session, roles, CSRF), Spring MVC controllers (server-rendered Thymeleaf + Bootstrap pages and /api/** REST endpoints), the @Transactional service layer and Spring Data JPA repositories, to MySQL 8 over JDBC.">
