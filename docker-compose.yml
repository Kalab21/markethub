# Local demo stack. Values default to the LOCAL-DEMO settings in .env.example.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-markethub_db}
      MYSQL_USER: ${MYSQL_USER:-markethub_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-markethub_pass}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      MYSQLHOST: db
      MYSQLPORT: 3306
      MYSQLDATABASE: ${MYSQL_DATABASE:-markethub_db}
      MYSQLUSER: ${MYSQL_USER:-markethub_user}
      MYSQLPASSWORD: ${MYSQL_PASSWORD:-markethub_pass}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
