<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/master-layout}">
<head>
    <title>Server Error</title>
</head>
<body>
<div layout:fragment="content" class="container">
    <div class="form-card mx-auto my-5 p-4 p-md-5 text-center" style="max-width: 640px;">
        <div class="empty-state p-0">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <h1 class="display-4 fw-bold text-danger mb-1">500</h1>
            <h5 class="mb-3">Something Went Wrong</h5>
            <p class="mb-4">
                An unexpected error occurred on the server. Please try again or contact support if the problem persists.
            </p>
        </div>
        <div class="d-flex justify-content-center flex-wrap gap-2">
            <a th:href="@{/onlinemarket/public/login}" class="btn btn-primary btn-icon">
                <i class="fa-solid fa-right-to-bracket"></i>Go to Login
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary btn-icon">
                <i class="fa-solid fa-arrow-left"></i>Go Back
            </a>
        </div>
    </div>
</div>
</body>
</html>
